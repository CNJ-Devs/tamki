name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build or retry
        required: true
        type: string

permissions:
  contents: read
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/native-build.yml
    with:
      release_tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.build.outputs.tag }}
      PRERELEASE: ${{ needs.build.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: downloaded
      - name: Verify all platform manifests and combine checksums
        run: node scripts/release.mjs combine downloaded release-assets "$RELEASE_TAG"
      - name: Verify transferred archive
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish verified release assets
        working-directory: release-assets
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > release-state.txt 2> release-error.txt; then
            if [ "$(cat release-state.txt)" = false ]; then
              echo "This tag is already published; preserving its existing assets."
              exit 0
            fi
          else
            if ! grep -q 'release not found' release-error.txt; then
              cat release-error.txt >&2
              exit 1
            fi
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Tamki $RELEASE_TAG" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" ./*.zip ./*.tar.gz SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --notes-file release-notes.md --prerelease="$PRERELEASE" --draft=false
