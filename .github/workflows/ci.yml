name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-15
    env:
      TAMKI_BACKGROUND_TEST: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .cache/ffmpeg-8.0.1
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/media-tool.mjs') }}
      - run: npm run check
      - run: npm test
      - run: npm run test:release
      - run: npm run test:browser
      - run: npm run test:capture
